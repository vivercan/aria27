name: Fix Logger Syntax
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix logger.info and logger.error syntax
        run: |
          sed -i 's|logger\.info(|logger("REQUISICION").info(|g' app/api/requisicion/route.ts
          sed -i 's|logger\.error(|logger("REQUISICION").error(|g' app/api/requisicion/route.ts
          echo "Fixed logger syntax"
          grep -n 'logger("REQUISICION")' app/api/requisicion/route.ts

      - name: Self-delete workflow and commit
        run: |
          rm -f .github/workflows/fix-logger-syntax.yml
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: logger syntax - use logger(REQUISICION).info/error"
          git push
