name: "feat: Enrich Obras hub + new sub-pages"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  enrich-obras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite Obras hub with new submodules
        run: |
          cat > app/dashboard/obras/page.tsx << 'EOF'
          "use client";

          import { Kanban, Gavel, FolderOpen, Scale, Building, Calculator, PackageCheck, Layers, Map, ListChecks, Camera } from "lucide-react";
          import Link from "next/link";

          const subModules = [
            {
              title: "Pipeline",
              description: "Seguimiento de proyectos activos.",
              href: "/dashboard/obras/pipeline",
              icon: Kanban,
              gradient: "from-blue-500 to-blue-600",
              active: true,
            },
            {
              title: "Licitaciones",
              description: "Gestión de licitaciones.",
              href: "/dashboard/obras/licitaciones",
              icon: Gavel,
              gradient: "from-amber-500 to-orange-500",
              active: true,
            },
            {
              title: "Expedientes",
              description: "Expedientes de obra.",
              href: "/dashboard/obras/expedientes",
              icon: FolderOpen,
              gradient: "from-emerald-500 to-emerald-600",
              active: true,
            },
            {
              title: "Contratos",
              description: "Contratos y documentación legal.",
              href: "/dashboard/obras/contratos",
              icon: Scale,
              gradient: "from-purple-500 to-purple-600",
              active: true,
            },
            {
              title: "SIROC",
              description: "Registro IMSS de obras.",
              href: "/dashboard/obras/siroc",
              icon: Building,
              gradient: "from-rose-500 to-pink-600",
              active: true,
            },
            {
              title: "Presupuestos",
              description: "Presupuestos y estimaciones.",
              href: "/dashboard/obras/presupuestos",
              icon: Calculator,
              gradient: "from-cyan-500 to-cyan-600",
              active: true,
            },
            {
              title: "Inventario",
              description: "Inventario de materiales por obra.",
              href: "/dashboard/obras/inventario",
              icon: PackageCheck,
              gradient: "from-teal-500 to-teal-600",
              active: true,
            },
            {
              title: "Concreto",
              description: "Control de colados, resistencias y pedidos.",
              href: "/dashboard/obras/concreto",
              icon: Layers,
              gradient: "from-gray-500 to-gray-600",
              active: true,
            },
            {
              title: "Planos",
              description: "Visor de planos y documentos técnicos.",
              href: "/dashboard/obras/planos",
              icon: Map,
              gradient: "from-indigo-500 to-indigo-600",
              active: true,
            },
            {
              title: "Tareas",
              description: "Asignación de tareas y seguimiento de cumplimiento.",
              href: "/dashboard/obras/tareas",
              icon: ListChecks,
              gradient: "from-lime-500 to-green-600",
              active: true,
            },
            {
              title: "Fotos de Avance",
              description: "Registro fotográfico de avance por obra.",
              href: "/dashboard/obras/fotos",
              icon: Camera,
              gradient: "from-orange-500 to-red-500",
              active: true,
            },
          ];

          export default function ObrasPage() {
            return (
              <div className="space-y-8">
                <div>
                  <h1 className="text-3xl font-bold text-white">Obras</h1>
                  <p className="text-slate-400 mt-1">Gestión de proyectos y construcción.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {subModules.map((module) => (
                    <Link
                      key={module.href}
                      href={module.href}
                      className={`group relative overflow-hidden rounded-2xl bg-slate-800/50 backdrop-blur-sm border transition-all duration-300 ${
                        module.active
                          ? "border-slate-700/50 hover:border-slate-600 hover:scale-[1.02] hover:shadow-2xl hover:shadow-blue-500/10"
                          : "border-slate-700/30 opacity-50 pointer-events-none"
                      }`}
                    >
                      <div className={`absolute inset-0 bg-gradient-to-br ${module.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300`} />
                      <div className="relative p-6">
                        <div className={`inline-flex p-3.5 rounded-xl bg-gradient-to-br ${module.gradient} shadow-lg mb-4`}>
                          <module.icon className="w-6 h-6 text-white" strokeWidth={1.75} />
                        </div>
                        <div className="space-y-2">
                          <div className="flex items-center gap-2">
                            <h3 className="font-semibold text-white text-lg group-hover:text-blue-300 transition-colors">
                              {module.title}
                            </h3>
                            {!module.active && (
                              <span className="px-2 py-0.5 text-[10px] font-bold bg-slate-500/20 text-slate-500 rounded-full border border-slate-500/30">
                                PRÓXIMO
                              </span>
                            )}
                          </div>
                          <p className="text-sm text-slate-400 leading-relaxed">{module.description}</p>
                        </div>
                        <div className="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-2 group-hover:translate-x-0">
                          <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                          </svg>
                        </div>
                      </div>
                    </Link>
                  ))}
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/obras/page.tsx

      - name: Create Concreto page
        run: |
          mkdir -p app/dashboard/obras/concreto
          cat > app/dashboard/obras/concreto/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Layers, Plus } from "lucide-react";
          import Link from "next/link";

          export default function ConcretoPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/obras" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">Concreto</h1>
                    <p className="text-slate-400 text-sm">Control de colados, resistencias y pedidos a concretera.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-lg transition-colors">
                    <Plus className="w-4 h-4" />
                    Nuevo Colado
                  </button>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <Layers className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay registros de colados.</p>
                  <p className="text-slate-500 text-sm mt-1">Registra colados con fecha, obra, resistencia y proveedor.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/obras/concreto/page.tsx

      - name: Create Planos page
        run: |
          mkdir -p app/dashboard/obras/planos
          cat > app/dashboard/obras/planos/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Map, Upload } from "lucide-react";
          import Link from "next/link";

          export default function PlanosPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/obras" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">Planos</h1>
                    <p className="text-slate-400 text-sm">Visor de planos y documentos técnicos por obra.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm rounded-lg transition-colors">
                    <Upload className="w-4 h-4" />
                    Subir Plano
                  </button>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <Map className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay planos cargados.</p>
                  <p className="text-slate-500 text-sm mt-1">Sube planos PDF o DWG organizados por obra y disciplina.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/obras/planos/page.tsx

      - name: Create Tareas page
        run: |
          mkdir -p app/dashboard/obras/tareas
          cat > app/dashboard/obras/tareas/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, ListChecks, Plus } from "lucide-react";
          import Link from "next/link";

          export default function TareasPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/obras" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">Tareas</h1>
                    <p className="text-slate-400 text-sm">Asignación de tareas y seguimiento de cumplimiento por obra.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-500 text-white text-sm rounded-lg transition-colors">
                    <Plus className="w-4 h-4" />
                    Nueva Tarea
                  </button>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <ListChecks className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay tareas asignadas.</p>
                  <p className="text-slate-500 text-sm mt-1">Asigna tareas a personal con fecha límite y seguimiento de avance.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/obras/tareas/page.tsx

      - name: Create Fotos de Avance page
        run: |
          mkdir -p app/dashboard/obras/fotos
          cat > app/dashboard/obras/fotos/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Camera, Upload } from "lucide-react";
          import Link from "next/link";

          export default function FotosPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/obras" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">Fotos de Avance</h1>
                    <p className="text-slate-400 text-sm">Registro fotográfico del avance de obra.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white text-sm rounded-lg transition-colors">
                    <Upload className="w-4 h-4" />
                    Subir Fotos
                  </button>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <Camera className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay fotos registradas.</p>
                  <p className="text-slate-500 text-sm mt-1">Sube fotos de avance con fecha, obra y descripción.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/obras/fotos/page.tsx

      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/enrich-1c-obras.yml
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: enrich Obras hub with Concreto, Planos, Tareas, Fotos de Avance"
          git push
