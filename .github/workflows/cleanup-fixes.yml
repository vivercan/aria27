name: Cleanup Fixes
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply dark mode and logger fixes
        run: echo "" | base64 -d | python3

      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/cleanup-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add -A
          git commit -m "fix: dark mode validate pages + console.log to logger"
          git push
