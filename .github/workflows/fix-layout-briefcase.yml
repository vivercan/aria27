name: "fix: add Briefcase import to layout"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Briefcase to lucide-react import in layout.tsx
        run: |
          sed -i 's/ChevronRight, LogOut, MessageCircle, Moon, Sun, X/ChevronRight, LogOut, MessageCircle, Moon, Sun, X, Briefcase/' app/dashboard/layout.tsx
          echo "--- Verifying fix ---"
          grep "Briefcase" app/dashboard/layout.tsx

      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/fix-layout-briefcase.yml
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: add Briefcase import to layout.tsx for Administracion module"
          git push
