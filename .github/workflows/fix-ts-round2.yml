name: Fix TS round 2
on:
  push:
    paths:
      - '.github/workflows/fix-ts-round2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix all TS errors
        shell: bash
        run: |
          set -e
          F1="app/dashboard/obras/expedientes/page.tsx"
          sed -i 's/loadCarpetas(obraSeleccionada\.id)/loadCarpetas(obraSeleccionada!.id)/' "$F1"
          sed -i '/^  if (loading) {/{N;s/if (loading) {\n  const confirmDelete/const confirmDelete/}' "$F1"
          sed -i '/loadObras();/{N;N;s/loadObras();\n  };\n    return (/loadObras();\n  };\n\n  if (loading) {\n    return (/}' "$F1"
          echo "Fixed expedientes"
          for F in app/dashboard/obras/pipeline/page.tsx app/dashboard/plantillas/documentos/page.tsx app/dashboard/plantillas/ordenes/page.tsx app/dashboard/plantillas/propuestas/page.tsx; do
            sed -i 's/msg("error", error?\.message)/msg("error", error?.message ?? "Error")/g' "$F"
          done
          echo "Fixed msg fallbacks"
          sed -i 's/texto: error?\.message }/texto: error?.message ?? "Error" }/g' app/dashboard/talento/nomina/manual/page.tsx
          sed -i 's/texto: e?\.message }/texto: e?.message ?? "Error" }/g' app/dashboard/talento/nomina/manual/page.tsx
          sed -i 's/texto: e?\.message }/texto: e?.message ?? "Error" }/g' app/dashboard/talento/nomina/pre-nomina/page.tsx
          echo "Fixed texto fallbacks"
          F5="app/dashboard/talento/usuarios/page.tsx"
          sed -i '1a\import DeleteModal from "@/components/DeleteModal";\nimport { useDeletePermission } from "@/lib/use-delete-permission";\nimport { backupAndDelete } from "@/lib/backup-delete";' "$F5"
          echo "Fixed usuarios imports"
          git diff --stat
      - name: Commit push cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "fix: TS build round 2 - confirmDelete scope, msg fallbacks, usuarios imports"
          git push
          rm -f .github/workflows/fix-ts-round2.yml
          git add -A
          git commit -m "chore: remove fix-ts-round2 workflow"
          git push
