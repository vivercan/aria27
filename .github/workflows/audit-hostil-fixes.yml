name: Audit Hostil Fixes v2
on:
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix 1 - Incompletas back nav to checadas
        run: sed -i 's|href="/dashboard/talento/nomina"|href="/dashboard/talento/checadas"|g' app/dashboard/talento/checadas/incompletas/page.tsx

      - name: Fix 2 - Enviar comparativa company name
        run: sed -i 's|Grupo Cuavante|Grupo Constructor Urbano Avante|g' app/api/requisicion/enviar-comparativa/route.ts

      - name: Fix 3 - Alertas remove Gantt reference
        run: sed -i 's|actividades atrasadas en el Gantt de obra|actividades con fechas vencidas en las obras registradas|g' app/dashboard/configuracion/alertas/page.tsx

      - name: Fix 4 - Obras hub add PackageCheck import and Inventario entry
        run: |
          sed -i 's|Calculator }|Calculator, PackageCheck }|' app/dashboard/obras/page.tsx
          sed -i '/icon: Calculator,/{n;s|gradient: "from-cyan-500 to-cyan-600"|gradient: "from-cyan-500 to-cyan-600"\n  },\n  {\n    title: "Inventario",\n    description: "Inventario de materiales por obra.",\n    href: "/dashboard/obras/inventario",\n    icon: PackageCheck,\n    gradient: "from-teal-500 to-teal-600"|;}' app/dashboard/obras/page.tsx

      - name: Fix 5 - AI route with auth by role and configurable model
        run: echo "" | base64 -d > app/api/ai/route.ts

      - name: Fix 6 - Capturar handle missing req param
        run: |
          FILE="app/dashboard/requisiciones/requisiciones/tramite/capturar/page.tsx"
          sed -i 's|href="/dashboard/requisiciones/requisiciones/estatus"|href="/dashboard/requisiciones/requisiciones/tramite"|g' "$FILE"
          python3 -c "
          c = open('app/dashboard/requisiciones/requisiciones/tramite/capturar/page.tsx').read()
          block = 'if (!reqId) return (\\n    <div className=\\"text-center py-20 text-slate-400\\">\\n      <FileText className=\\"w-10 h-10 mx-auto mb-3 opacity-30\\" />\\n      <p className=\\"mb-2\\">Selecciona una requisici\\u00f3n desde Tr\\u00e1mite</p>\\n      <Link href=\\"/dashboard/requisiciones/requisiciones/tramite\\" className=\\"text-blue-400 hover:underline text-sm\\">\\n        \\u2190 Ir a Tr\\u00e1mite\\n      </Link>\\n    </div>\\n  );\\n\\n  '
          c = c.replace('if (!requisition) return (', block + 'if (!requisition) return (')
          open('app/dashboard/requisiciones/requisiciones/tramite/capturar/page.tsx','w').write(c)
          "

      - name: Self-delete workflow and commit
        run: |
          rm -f .github/workflows/audit-hostil-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auditoria hostil - 6 correcciones criticas"
          git push
