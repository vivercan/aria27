name: "feat: Administracion module + sidebar"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  add-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Administracion to sidebar layout
        run: |
          sed -i 's/import { HardHat, Users, Package, Wallet, Warehouse, FileText, Settings, Search, ChevronRight, LogOut, MessageCircle, Moon, Sun, X } from "lucide-react";/import { HardHat, Users, Package, Wallet, Warehouse, FileText, Settings, Search, ChevronRight, LogOut, MessageCircle, Moon, Sun, X, Briefcase } from "lucide-react";/' app/dashboard/layout.tsx
          sed -i '/{ name: "Configuración"/i\  { name: "Administración", icon: Briefcase, href: "/dashboard/administracion" },' app/dashboard/layout.tsx

      - name: Create Administracion hub page
        run: |
          mkdir -p app/dashboard/administracion
          cat > app/dashboard/administracion/page.tsx << 'HUBEOF'
          "use client";

          import { FileText, Shield, ScrollText, Building2 } from "lucide-react";
          import Link from "next/link";

          const subModules = [
            {
              title: "Documentación Legal",
              description: "Acta constitutiva, TIP, REPSE, CSF, domicilio fiscal y opiniones de cumplimiento.",
              href: "/dashboard/administracion/documentacion",
              icon: FileText,
              gradient: "from-blue-500 to-blue-600",
              active: true,
            },
            {
              title: "Pólizas",
              description: "Pólizas de seguro y fianzas subsecuentes.",
              href: "/dashboard/administracion/polizas",
              icon: Shield,
              gradient: "from-emerald-500 to-emerald-600",
              active: true,
            },
            {
              title: "Opiniones de Cumplimiento",
              description: "IMSS, Infonavit, SAT, SAR.",
              href: "/dashboard/administracion/opiniones",
              icon: ScrollText,
              gradient: "from-amber-500 to-orange-500",
              active: true,
            },
            {
              title: "Datos de Empresa",
              description: "Información general de GCU Avante y centros de costo.",
              href: "/dashboard/administracion/empresa",
              icon: Building2,
              gradient: "from-purple-500 to-purple-600",
              active: true,
            },
          ];

          export default function AdministracionPage() {
            return (
              <div className="space-y-8">
                <div>
                  <h1 className="text-3xl font-bold text-white">Administración</h1>
                  <p className="text-slate-400 mt-1">Documentación legal, pólizas y cumplimiento corporativo.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {subModules.map((module) => (
                    <Link
                      key={module.href}
                      href={module.href}
                      className={`group relative overflow-hidden rounded-2xl bg-slate-800/50 backdrop-blur-sm border transition-all duration-300 ${
                        module.active
                          ? "border-slate-700/50 hover:border-slate-600 hover:scale-[1.02] hover:shadow-2xl hover:shadow-blue-500/10"
                          : "border-slate-700/30 opacity-50 pointer-events-none"
                      }`}
                    >
                      <div className={`absolute inset-0 bg-gradient-to-br ${module.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300`} />
                      <div className="relative p-6">
                        <div className={`inline-flex p-3.5 rounded-xl bg-gradient-to-br ${module.gradient} shadow-lg mb-4`}>
                          <module.icon className="w-6 h-6 text-white" strokeWidth={1.75} />
                        </div>
                        <div className="space-y-2">
                          <h3 className="font-semibold text-white text-lg group-hover:text-blue-300 transition-colors">
                            {module.title}
                          </h3>
                          <p className="text-sm text-slate-400 leading-relaxed">{module.description}</p>
                        </div>
                        <div className="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-2 group-hover:translate-x-0">
                          <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                          </svg>
                        </div>
                      </div>
                    </Link>
                  ))}
                </div>
              </div>
            );
          }
          HUBEOF
          sed -i 's/^          //' app/dashboard/administracion/page.tsx

      - name: Add administracion to permissions
        run: |
          if grep -q "VALID_MODULES" src/lib/permissions.ts 2>/dev/null; then
            sed -i 's/configuracion/configuracion", "administracion/' src/lib/permissions.ts
          fi

      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/enrich-1a-admin-hub.yml
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: add Administracion module to sidebar + hub page"
          git push
