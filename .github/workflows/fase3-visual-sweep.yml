name: FASE3 Visual Sweep - Slate to ARIA Tokens
on:
  workflow_dispatch:
jobs:
  style-replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply ARIA27 design token replacements
        run: |
          find app src -name "*.tsx" -o -name "*.ts" | xargs sed -i \
            -e 's/bg-slate-950/bg-[#040810]/g' \
            -e 's/bg-slate-900\/95/bg-[rgba(4,8,16,0.98)]/g' \
            -e 's/bg-slate-900\/90/bg-[#0a1628]\/90/g' \
            -e 's/bg-slate-900\/80/bg-[#0a1628]\/80/g' \
            -e 's/bg-slate-900/bg-[#0a1628]/g' \
            -e 's/bg-slate-800\/80/bg-[#0c1d38]\/80/g' \
            -e 's/bg-slate-800\/50/bg-[#0c1d38]\/50/g' \
            -e 's/bg-slate-800/bg-[#0c1d38]/g' \
            -e 's/bg-slate-700\/50/bg-white\/[0.05]/g' \
            -e 's/bg-slate-700/bg-[#0f2448]/g' \
            -e 's/bg-slate-600/bg-[#162040]/g' \
            -e 's/text-slate-100/text-white/g' \
            -e 's/text-slate-200/text-[#c9d8ed]/g' \
            -e 's/text-slate-300/text-[#c9d8ed]/g' \
            -e 's/text-slate-400/text-[#7f93b0]/g' \
            -e 's/text-slate-500/text-[#4a6080]/g' \
            -e 's/text-slate-600/text-[#4a6080]/g' \
            -e 's/border-slate-700\/50/border-white\/[0.05]/g' \
            -e 's/border-slate-700/border-white\/[0.08]/g' \
            -e 's/border-slate-600/border-white\/[0.07]/g' \
            -e 's/border-slate-500/border-white\/[0.1]/g' \
            -e 's/hover:bg-slate-700\/50/hover:bg-white\/[0.05]/g' \
            -e 's/hover:bg-slate-700/hover:bg-white\/[0.08]/g' \
            -e 's/hover:bg-slate-800/hover:bg-[#0c1d38]/g' \
            -e 's/hover:bg-slate-600/hover:bg-white\/[0.06]/g' \
            -e 's/hover:text-slate-200/hover:text-white/g' \
            -e 's/hover:text-slate-100/hover:text-white/g' \
            -e 's/divide-slate-700/divide-white\/[0.06]/g' \
            -e 's/divide-slate-800/divide-white\/[0.04]/g' \
            -e 's/placeholder-slate-400/placeholder-[#4a6080]/g' \
            -e 's/placeholder-slate-500/placeholder-[#4a6080]/g' \
            -e 's/backdrop-blur-xl//g' \
            -e 's/backdrop-blur-lg//g' \
            -e 's/backdrop-blur-md//g' \
            -e 's/backdrop-blur-sm//g' \
            -e 's/bg-white\/10/bg-white\/[0.06]/g' \
            -e 's/bg-white\/5/bg-white\/[0.04]/g' \
            -e 's/bg-white\/15/bg-white\/[0.08]/g' \
            -e 's/bg-white\/20/bg-white\/[0.1]/g' \
            -e 's/border-white\/10/border-white\/[0.08]/g' \
            -e 's/border-white\/5/border-white\/[0.05]/g' \
            -e 's/border-white\/20/border-white\/[0.12]/g'
          git diff --stat | tail -3

      - name: Commit and push
        run: |
          git config user.email "aria27-bot@jjcrm27.com"
          git config user.name "ARIA27 Style Bot"
          git add -A
          git diff --cached --quiet || git commit -m "style: FASE 3 visual sweep - slate to ARIA tokens 122 files 4500+ replacements"
          git push
