name: "feat: Enrich Finanzas + Activos hubs"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite Finanzas hub with SUA and Ingreso-Egresos
        run: |
          cat > app/dashboard/finanzas/page.tsx << 'EOF'
          "use client";

          import { Receipt, PieChart, FileSpreadsheet, Landmark, Wallet, CreditCard, HandCoins, Building2, ArrowLeftRight } from "lucide-react";
          import Link from "next/link";

          const subModules = [
            {
              title: "Gastos de Obra",
              description: "Registro y control de gastos por obra.",
              href: "/dashboard/finanzas/gastos-obra",
              icon: Receipt,
              gradient: "from-blue-500 to-blue-600",
              active: true,
            },
            {
              title: "Costeo",
              description: "Costeo por obra y partida.",
              href: "/dashboard/finanzas/costeo",
              icon: PieChart,
              gradient: "from-emerald-500 to-emerald-600",
              active: true,
            },
            {
              title: "Facturación",
              description: "Emisión y seguimiento de facturas.",
              href: "/dashboard/finanzas/facturacion",
              icon: FileSpreadsheet,
              gradient: "from-amber-500 to-orange-500",
              active: true,
            },
            {
              title: "Caja Chica",
              description: "Control de fondo revolvente.",
              href: "/dashboard/finanzas/caja",
              icon: Wallet,
              gradient: "from-purple-500 to-purple-600",
              active: true,
            },
            {
              title: "Bancos",
              description: "Conciliaciones y movimientos bancarios.",
              href: "/dashboard/finanzas/bancos",
              icon: Landmark,
              gradient: "from-cyan-500 to-cyan-600",
              active: true,
            },
            {
              title: "Por Pagar",
              description: "Cuentas por pagar a proveedores.",
              href: "/dashboard/finanzas/por-pagar",
              icon: CreditCard,
              gradient: "from-rose-500 to-pink-600",
              active: true,
            },
            {
              title: "Cobranza",
              description: "Seguimiento de cuentas por cobrar.",
              href: "/dashboard/finanzas/cobranza",
              icon: HandCoins,
              gradient: "from-teal-500 to-teal-600",
              active: true,
            },
            {
              title: "SUA / Infonavit",
              description: "Control de aportaciones SUA e Infonavit.",
              href: "/dashboard/finanzas/sua",
              icon: Building2,
              gradient: "from-indigo-500 to-indigo-600",
              active: true,
            },
            {
              title: "Ingreso - Egresos",
              description: "Reporte consolidado de ingresos y egresos.",
              href: "/dashboard/finanzas/ingreso-egresos",
              icon: ArrowLeftRight,
              gradient: "from-lime-500 to-green-600",
              active: true,
            },
          ];

          export default function FinanzasPage() {
            return (
              <div className="space-y-8">
                <div>
                  <h1 className="text-3xl font-bold text-white">Finanzas</h1>
                  <p className="text-slate-400 mt-1">Gestión financiera y contable.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {subModules.map((module) => (
                    <Link
                      key={module.href}
                      href={module.href}
                      className={`group relative overflow-hidden rounded-2xl bg-slate-800/50 backdrop-blur-sm border transition-all duration-300 ${
                        module.active
                          ? "border-slate-700/50 hover:border-slate-600 hover:scale-[1.02] hover:shadow-2xl hover:shadow-blue-500/10"
                          : "border-slate-700/30 opacity-50 pointer-events-none"
                      }`}
                    >
                      <div className={`absolute inset-0 bg-gradient-to-br ${module.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300`} />
                      <div className="relative p-6">
                        <div className={`inline-flex p-3.5 rounded-xl bg-gradient-to-br ${module.gradient} shadow-lg mb-4`}>
                          <module.icon className="w-6 h-6 text-white" strokeWidth={1.75} />
                        </div>
                        <div className="space-y-2">
                          <div className="flex items-center gap-2">
                            <h3 className="font-semibold text-white text-lg group-hover:text-blue-300 transition-colors">
                              {module.title}
                            </h3>
                            {!module.active && (
                              <span className="px-2 py-0.5 text-[10px] font-bold bg-slate-500/20 text-slate-500 rounded-full border border-slate-500/30">
                                PRÓXIMO
                              </span>
                            )}
                          </div>
                          <p className="text-sm text-slate-400 leading-relaxed">{module.description}</p>
                        </div>
                        <div className="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-2 group-hover:translate-x-0">
                          <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                          </svg>
                        </div>
                      </div>
                    </Link>
                  ))}
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/finanzas/page.tsx

      - name: Create SUA page
        run: |
          mkdir -p app/dashboard/finanzas/sua
          cat > app/dashboard/finanzas/sua/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Building2, Upload } from "lucide-react";
          import Link from "next/link";

          export default function SUAPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/finanzas" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">SUA / Infonavit</h1>
                    <p className="text-slate-400 text-sm">Control de aportaciones SUA e Infonavit.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm rounded-lg transition-colors">
                    <Upload className="w-4 h-4" />
                    Cargar Archivo SUA
                  </button>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <Building2 className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay registros de aportaciones.</p>
                  <p className="text-slate-500 text-sm mt-1">Carga archivos SUA para llevar control de aportaciones IMSS e Infonavit.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/finanzas/sua/page.tsx

      - name: Create Ingreso-Egresos page
        run: |
          mkdir -p app/dashboard/finanzas/ingreso-egresos
          cat > app/dashboard/finanzas/ingreso-egresos/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, ArrowLeftRight } from "lucide-react";
          import Link from "next/link";

          export default function IngresoEgresosPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/finanzas" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div>
                    <h1 className="text-2xl font-bold text-white">Ingreso - Egresos</h1>
                    <p className="text-slate-400 text-sm">Reporte consolidado de ingresos y egresos.</p>
                  </div>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <ArrowLeftRight className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">Sin datos de periodo.</p>
                  <p className="text-slate-500 text-sm mt-1">Selecciona un periodo para ver el reporte de ingresos vs egresos.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/finanzas/ingreso-egresos/page.tsx

      - name: Rewrite Activos hub with Vehiculos
        run: |
          cat > app/dashboard/activos/page.tsx << 'EOF'
          "use client";

          import { BookOpen, Activity, UserCheck, Wrench, Car } from "lucide-react";
          import Link from "next/link";

          const subModules = [
            {
              title: "Catálogo",
              description: "Inventario general de activos fijos.",
              href: "/dashboard/activos/catalogo",
              icon: BookOpen,
              gradient: "from-blue-500 to-blue-600",
              active: true,
            },
            {
              title: "Estado",
              description: "Estado actual y disponibilidad de activos.",
              href: "/dashboard/activos/estado",
              icon: Activity,
              gradient: "from-emerald-500 to-emerald-600",
              active: true,
            },
            {
              title: "Asignación",
              description: "Asignación de activos a personal u obras.",
              href: "/dashboard/activos/asignacion",
              icon: UserCheck,
              gradient: "from-amber-500 to-orange-500",
              active: true,
            },
            {
              title: "Mantenimiento",
              description: "Programación y registro de mantenimientos.",
              href: "/dashboard/activos/mantenimiento",
              icon: Wrench,
              gradient: "from-purple-500 to-purple-600",
              active: true,
            },
            {
              title: "Vehículos",
              description: "Control de vehículos, llaves y maquinaria.",
              href: "/dashboard/activos/vehiculos",
              icon: Car,
              gradient: "from-rose-500 to-pink-600",
              active: true,
            },
          ];

          export default function ActivosPage() {
            return (
              <div className="space-y-8">
                <div>
                  <h1 className="text-3xl font-bold text-white">Activos</h1>
                  <p className="text-slate-400 mt-1">Gestión de activos fijos y equipamiento.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {subModules.map((module) => (
                    <Link
                      key={module.href}
                      href={module.href}
                      className={`group relative overflow-hidden rounded-2xl bg-slate-800/50 backdrop-blur-sm border transition-all duration-300 ${
                        module.active
                          ? "border-slate-700/50 hover:border-slate-600 hover:scale-[1.02] hover:shadow-2xl hover:shadow-blue-500/10"
                          : "border-slate-700/30 opacity-50 pointer-events-none"
                      }`}
                    >
                      <div className={`absolute inset-0 bg-gradient-to-br ${module.gradient} opacity-0 group-hover:opacity-10 transition-opacity duration-300`} />
                      <div className="relative p-6">
                        <div className={`inline-flex p-3.5 rounded-xl bg-gradient-to-br ${module.gradient} shadow-lg mb-4`}>
                          <module.icon className="w-6 h-6 text-white" strokeWidth={1.75} />
                        </div>
                        <div className="space-y-2">
                          <h3 className="font-semibold text-white text-lg group-hover:text-blue-300 transition-colors">
                            {module.title}
                          </h3>
                          <p className="text-sm text-slate-400 leading-relaxed">{module.description}</p>
                        </div>
                        <div className="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-2 group-hover:translate-x-0">
                          <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                          </svg>
                        </div>
                      </div>
                    </Link>
                  ))}
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/activos/page.tsx

      - name: Create Vehiculos page
        run: |
          mkdir -p app/dashboard/activos/vehiculos
          cat > app/dashboard/activos/vehiculos/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Car, Plus } from "lucide-react";
          import Link from "next/link";

          export default function VehiculosPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/activos" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">Vehículos</h1>
                    <p className="text-slate-400 text-sm">Control de vehículos, llaves y maquinaria.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-sm rounded-lg transition-colors">
                    <Plus className="w-4 h-4" />
                    Nuevo Vehículo
                  </button>
                </div>
                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <Car className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay vehículos registrados.</p>
                  <p className="text-slate-500 text-sm mt-1">Registra vehículos y maquinaria con placas, responsable y control de llaves.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/activos/vehiculos/page.tsx

      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/enrich-2-finanzas-activos.yml
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: enrich Finanzas (SUA, Ingreso-Egresos) + Activos (Vehiculos)"
          git push
