name: "feat: Administracion sub-pages"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  admin-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Documentacion Legal page
        run: |
          mkdir -p app/dashboard/administracion/documentacion
          cat > app/dashboard/administracion/documentacion/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Upload, FileText, Search } from "lucide-react";
          import Link from "next/link";
          import { useState } from "react";

          const documentTypes = [
            "Acta Constitutiva",
            "TIP (Tarjeta de Identificación Patronal)",
            "REPSE",
            "CSF (Constancia de Situación Fiscal)",
            "Comprobante de Domicilio",
            "Poder Notarial",
          ];

          export default function DocumentacionPage() {
            const [searchTerm, setSearchTerm] = useState("");

            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/administracion" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div>
                    <h1 className="text-2xl font-bold text-white">Documentación Legal</h1>
                    <p className="text-slate-400 text-sm">Acta constitutiva, TIP, REPSE, CSF y documentos corporativos.</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="flex-1 flex items-center gap-2 px-3 py-2 rounded-lg bg-white/5 border border-slate-700/50">
                    <Search className="w-4 h-4 text-slate-500" />
                    <input
                      type="text"
                      placeholder="Buscar documento..."
                      className="bg-transparent outline-none text-sm text-white w-full"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                    />
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-lg transition-colors">
                    <Upload className="w-4 h-4" />
                    Subir Documento
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {documentTypes
                    .filter((d) => d.toLowerCase().includes(searchTerm.toLowerCase()))
                    .map((docType) => (
                      <div
                        key={docType}
                        className="p-5 rounded-xl bg-slate-800/50 border border-slate-700/50 hover:border-slate-600 transition-all cursor-pointer"
                      >
                        <div className="flex items-start gap-3">
                          <div className="p-2 rounded-lg bg-blue-500/10">
                            <FileText className="w-5 h-5 text-blue-400" />
                          </div>
                          <div className="flex-1">
                            <h3 className="text-sm font-medium text-white">{docType}</h3>
                            <p className="text-xs text-slate-500 mt-1">Sin documentos cargados</p>
                          </div>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/administracion/documentacion/page.tsx

      - name: Create Polizas page
        run: |
          mkdir -p app/dashboard/administracion/polizas
          cat > app/dashboard/administracion/polizas/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Shield, Plus } from "lucide-react";
          import Link from "next/link";

          export default function PolizasPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/administracion" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div className="flex-1">
                    <h1 className="text-2xl font-bold text-white">Pólizas</h1>
                    <p className="text-slate-400 text-sm">Pólizas de seguro y fianzas subsecuentes.</p>
                  </div>
                  <button className="flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm rounded-lg transition-colors">
                    <Plus className="w-4 h-4" />
                    Nueva Póliza
                  </button>
                </div>

                <div className="bg-slate-800/50 border border-slate-700/50 rounded-xl p-8 text-center">
                  <Shield className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400">No hay pólizas registradas.</p>
                  <p className="text-slate-500 text-sm mt-1">Agrega pólizas de seguro y fianzas para llevar control de vencimientos.</p>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/administracion/polizas/page.tsx

      - name: Create Opiniones page
        run: |
          mkdir -p app/dashboard/administracion/opiniones
          cat > app/dashboard/administracion/opiniones/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, ScrollText, Upload } from "lucide-react";
          import Link from "next/link";

          const opiniones = [
            { name: "IMSS", desc: "Opinión de cumplimiento del Instituto Mexicano del Seguro Social." },
            { name: "Infonavit", desc: "Opinión de cumplimiento de aportaciones patronales." },
            { name: "SAT", desc: "Opinión de cumplimiento de obligaciones fiscales (32-D)." },
            { name: "SAR", desc: "Opinión de cumplimiento del Sistema de Ahorro para el Retiro." },
          ];

          export default function OpinionesPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/administracion" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div>
                    <h1 className="text-2xl font-bold text-white">Opiniones de Cumplimiento</h1>
                    <p className="text-slate-400 text-sm">IMSS, Infonavit, SAT, SAR.</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {opiniones.map((op) => (
                    <div key={op.name} className="p-5 rounded-xl bg-slate-800/50 border border-slate-700/50 hover:border-slate-600 transition-all">
                      <div className="flex items-start justify-between">
                        <div className="flex items-start gap-3">
                          <div className="p-2 rounded-lg bg-amber-500/10">
                            <ScrollText className="w-5 h-5 text-amber-400" />
                          </div>
                          <div>
                            <h3 className="text-sm font-medium text-white">{op.name}</h3>
                            <p className="text-xs text-slate-500 mt-1">{op.desc}</p>
                            <p className="text-xs text-red-400 mt-2">Sin documento vigente</p>
                          </div>
                        </div>
                        <button className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                          <Upload className="w-4 h-4 text-slate-400" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/administracion/opiniones/page.tsx

      - name: Create Empresa page
        run: |
          mkdir -p app/dashboard/administracion/empresa
          cat > app/dashboard/administracion/empresa/page.tsx << 'EOF'
          "use client";

          import { ArrowLeft, Building2 } from "lucide-react";
          import Link from "next/link";

          export default function EmpresaPage() {
            return (
              <div className="p-6 space-y-6 overflow-y-auto h-full">
                <div className="flex items-center gap-3">
                  <Link href="/dashboard/administracion" className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <ArrowLeft className="w-5 h-5 text-slate-400" />
                  </Link>
                  <div>
                    <h1 className="text-2xl font-bold text-white">Datos de Empresa</h1>
                    <p className="text-slate-400 text-sm">Información de GCU Avante y centros de costo.</p>
                  </div>
                </div>

                <div className="p-5 rounded-xl bg-slate-800/50 border border-slate-700/50">
                  <div className="flex items-center gap-3 mb-4">
                    <Building2 className="w-6 h-6 text-purple-400" />
                    <h2 className="text-lg font-semibold text-white">Grupo Constructor Urbano Avante</h2>
                  </div>
                  <div className="grid grid-cols-2 gap-4 text-sm">
                    <div><span className="text-slate-500">RFC:</span> <span className="text-white ml-2">—</span></div>
                    <div><span className="text-slate-500">Régimen:</span> <span className="text-white ml-2">—</span></div>
                    <div><span className="text-slate-500">Domicilio Fiscal:</span> <span className="text-white ml-2">Aguascalientes, Ags.</span></div>
                    <div><span className="text-slate-500">Representante Legal:</span> <span className="text-white ml-2">—</span></div>
                  </div>
                </div>

                <div>
                  <h3 className="text-sm font-medium text-slate-400 mb-3">Centros de Costo</h3>
                  <div className="space-y-2">
                    {["Avante", "Denivel", "Tendevel"].map((cc) => (
                      <div key={cc} className="p-3 rounded-lg bg-slate-800/30 border border-slate-700/30 flex items-center justify-between">
                        <span className="text-sm text-white">{cc}</span>
                        <span className="text-xs text-slate-500">Centro de costo</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          }
          EOF
          sed -i 's/^          //' app/dashboard/administracion/empresa/page.tsx

      - name: Self-delete and commit
        run: |
          rm -f .github/workflows/enrich-1b-admin-pages.yml
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: add Administracion sub-pages (documentacion, polizas, opiniones, empresa)"
          git push
